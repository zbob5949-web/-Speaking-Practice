[project]
name = "speakmate-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "edge-tts>=6.1.0",
  "PyJWT>=2.8.0",
  "bcrypt>=4.1.0",
  "sherpa-onnx>=1.13.0",
  "miniaudio>=1.60",
  "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
